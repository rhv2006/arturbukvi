    body { margin: 0; overflow: hidden; background: #000; font-family: Arial, Helvetica, sans-serif; }
    #scan-overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; z-index: 40; transition: opacity .5s; }
    #scan-overlay.hide { opacity: 0; visibility: hidden; }
    #scan-text { color: #fff; font-size: 18px; margin: 24px; text-align: center; text-shadow: 0 0 6px #000; font-weight: bold; }
    .star { position: absolute; width: 64px; height: 64px; filter: invert(1) brightness(2); }
    .ui-bar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 15px; z-index: 50; width: 90%; justify-content: center; }

<body>
  <div id="scan-overlay">
    <div id="scan-text">Наведите камеру на QR-код — сундук откроется!</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: no; uiScanning: no;" 
    vr-mode-ui="enabled: false" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    device-orientation-permission-ui="enabled: true">
    
    <a-assets>
      <video id="clip" preload="auto" loop playsinline webkit-playsinline src="clip_lq.mp4" crossorigin="anonymous"></video>
    </a-assets>

    <a-camera look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video src="#clip" width="2.048" height="3.072" position="0 0 0"></a-video>
    </a-entity>

    <script>
      const video = document.querySelector('#clip');
      const target = document.querySelector('[mindar-image-target]');
      const overlay = document.getElementById('scan-overlay');

      // Автозапуск видео при обнаружении цели
      target.addEventListener('targetFound', () => {
        overlay.classList.add('hide');
        video.play().catch(e => console.log("Autoplay blocked or error:", e));
      });

      target.addEventListener('targetLost', () => {
        overlay.classList.remove('hide');
        video.pause();
      });

      // Звезды Lottie
      const starPath = 'xmas-star.json';
      const overlayEl = document.getElementById('scan-overlay');
      const createStar = (x, y, size) => {
        const div = document.createElement('div');
        div.className = 'star';
        div.style.left = x + 'px';
        div.style.top = y + 'px';
        div.style.width = div.style.height = size + 'px';
        overlayEl.appendChild(div);
        lottie.loadAnimation({
          container: div,
          renderer: 'svg',
          loop: true,
          autoplay: true,
          path: starPath
        });
      };

      const initStars = () => {
        const {innerWidth: W, innerHeight: H} = window;
        for(let i=0; i<6; i++) createStar(Math.random()*W*0.8 + W*0.1, Math.random()*H*0.35, 40 + Math.random()*40);
        for(let i=0; i<4; i++) createStar(Math.random()*W*0.8 + W*0.1, H*0.65 + Math.random()*H*0.3, 40 + Math.random()*40);
      };

      initStars();
    </script>
  </a-scene>
